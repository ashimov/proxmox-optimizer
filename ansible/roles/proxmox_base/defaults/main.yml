---
xs_utils_packages:
  - axel
  - build-essential
  - curl
  - dialog
  - dnsutils
  - dos2unix
  - git
  - gnupg-agent
  - grc
  - htop
  - iftop
  - iotop
  - iperf
  - ipset
  - iptraf
  - plocate
  - msr-tools
  - nano
  - net-tools
  - tmux
  - unzip
  - vim
  - vim-nox
  - wget
  - whois
  - zip

xs_base_packages:
  - zfsutils-linux
  - proxmox-backup-restore-image
  - chrony

xs_apt_dependencies:
  - apt-transport-https
  - debian-archive-keyring
  - ca-certificates
  - curl

# Manage /etc/apt/sources.list for clean installs
xs_manage_sources_list: "yes"

# Proxmox GPG key checksums (SHA256)
# These should be verified from Proxmox official sources
# Set to empty string to skip checksum validation (not recommended)
# Default repo key path (set dynamically in tasks based on OS codename)
proxmox_repo_key_path: "/etc/apt/keyrings/proxmox-release-bookworm.gpg"

# Obtain a value with:
#   wget -qO- https://enterprise.proxmox.com/debian/proxmox-release-<codename>.gpg | sha256sum
# An empty value downloads the key over TLS only and logs a warning.
proxmox_key_checksums:
  bookworm: "sha256:7da6fe34168adc6e479327ba517796d4702fa2f8b4f0a9833f5ea6e6b48f6507"
  # Set this to the checksum of the key your fleet trusts before rolling out PVE 9.
  trixie: ""
