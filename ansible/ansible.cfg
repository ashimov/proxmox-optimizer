[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# 'yaml' as a callback name resolves to community.general.yaml, which was
# removed in community.general 12. The builtin default plus result_format does
# the same thing and does not depend on a collection version.
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
