---
# There is no infrastructure to create here: the scenario runs syntax checks,
# host resolution and rendering assertions against the checkout itself.
# 'delegated' was removed from molecule, 'default' is the current name.
dependency:
  name: galaxy
  options:
    requirements-file: ../../collections/requirements.yml

driver:
  name: default

platforms:
  - name: localhost

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - converge
    - verify
