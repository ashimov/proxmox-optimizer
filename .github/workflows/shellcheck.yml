---
name: shellcheck

"on":
  push:
    branches: [master, main]
    paths:
      - '**.sh'
      - 'hetzner/pve'
      - 'hetzner/pbs'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [master, main]
    paths:
      - '**.sh'
      - 'hetzner/pve'
      - 'hetzner/pbs'
      - '.shellcheckrc'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run shellcheck
        run: |
          # *.sh plus the extensionless Hetzner post-install scripts
          find . -path ./.git -prune -o -path ./.history -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck
          shellcheck hetzner/pve hetzner/pbs
