---
name: YAML Lint

"on":
  push:
    branches: [master, main]
    paths:
      - 'ansible/**/*.yml'
      - 'ansible/**/*.yaml'
      - 'tests/**/*.yml'
      - '.yamllint.yml'
      - '.github/**/*.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ansible/**/*.yml'
      - 'ansible/**/*.yaml'
      - 'tests/**/*.yml'
      - '.yamllint.yml'
      - '.github/**/*.yml'

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint on Ansible files
        run: |
          yamllint -c .yamllint.yml ansible/ tests/ .github/
