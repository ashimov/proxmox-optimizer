---
name: ansible-lint

"on":
  push:
    branches: [master, main]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ansible/requirements.txt'

      - name: Install ansible-lint
        run: |
          pip install -r ansible/requirements.txt 'ansible-lint>=24'

      - name: Cache Ansible collections
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-v1-${{ hashFiles('ansible/collections/requirements.yml') }}

      - name: Install Ansible collections
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Run ansible-lint
        working-directory: ./ansible
        run: |
          ansible-lint -c ../.ansible-lint playbooks/ roles/
