---
name: ansible-lint

"on":
  push:
    branches: [master, main]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ansible/requirements.txt'

      - name: Install ansible-lint
        run: |
          pip install -r ansible/requirements.txt 'ansible-lint>=24'

      - name: Cache Ansible collections
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-v1-${{ hashFiles('ansible/collections/requirements.yml') }}

      - name: Install Ansible collections
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Run ansible-lint
        working-directory: ./ansible
        run: |
          ansible-lint -c ../.ansible-lint playbooks/ roles/
