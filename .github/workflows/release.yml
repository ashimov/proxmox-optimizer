---
name: release

# Tag-driven only. workflow_dispatch has no inputs on purpose: an input used in
# 'ref:' or interpolated into 'run:' is an injection point, and the ref picker
# in the Actions UI does the same job.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # create the release
      id-token: write     # cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Tags from before this pipeline existed have no checksum script, so there
      # is nothing to build for them. Skip rather than fail the run.
      - name: Check whether this tag has the release tooling
        id: guard
        run: |
          if [ -x scripts/make-checksums.sh ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "This tag predates scripts/make-checksums.sh, nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SHA256SUMS
        if: steps.guard.outputs.build == 'true'
        run: ./scripts/make-checksums.sh SHA256SUMS

      - name: Show checksums
        if: steps.guard.outputs.build == 'true'
        run: cat SHA256SUMS

      - name: Install cosign
        if: steps.guard.outputs.build == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless: the signature is bound to this workflow's identity, so there is
      # no private key to store or rotate.
      - name: Sign SHA256SUMS
        if: steps.guard.outputs.build == 'true'
        run: |
          # .sig/.pem for cosign 2.x, .bundle for 3.x which deprecates them
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS

      - name: Write release notes
        if: steps.guard.outputs.build == 'true'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            printf 'Checksums for every script in this tag are in `SHA256SUMS`.\n\n'
            printf 'Verify before running anything:\n\n'
            printf '```bash\n'
            printf 'RELEASE=%s\n' "$TAG"
            printf 'BASE="https://github.com/%s/releases/download/${RELEASE}"\n' "$REPO"
            printf 'wget "${BASE}/SHA256SUMS" "${BASE}/SHA256SUMS.sig" "${BASE}/SHA256SUMS.pem"\n\n'
            printf '# optional: check that the checksum list itself is genuine\n'
            printf 'cosign verify-blob \\\n'
            printf '  --certificate SHA256SUMS.pem \\\n'
            printf '  --signature SHA256SUMS.sig \\\n'
            printf "  --certificate-identity-regexp '^https://github.com/%s/' \\\\\n" "$REPO"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n'
            printf '  SHA256SUMS\n\n'
            printf '# then the scripts you actually downloaded\n'
            printf 'sha256sum --ignore-missing -c SHA256SUMS\n'
            printf '```\n\n'
            printf 'See CHANGELOG.md for what changed.\n'
          } > RELEASE_NOTES.md

      # Draft on purpose: publish once the tag is on the branch you actually
      # ship from. 'gh release edit <tag> --draft=false' or the web UI.
      - name: Create draft release
        if: steps.guard.outputs.build == 'true'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
            SHA256SUMS.bundle
          fail_on_unmatched_files: true
