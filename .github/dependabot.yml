---
version: 2
updates:
  # Actions are pinned by SHA, which is right, and means they never move on
  # their own. This is what tells us when one should.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /ansible
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    ignore:
      # ansible 13 and up need Python 3.12. The supported hosts are Debian 12
      # (3.11) and Debian 13, and the fixture runs on Debian 12, so the upper
      # bound in requirements.txt is deliberate. Revisit when Bookworm is out
      # of scope.
      - dependency-name: ansible
        versions:
          - ">=13"
